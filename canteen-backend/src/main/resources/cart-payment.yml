# 购物车与支付配置模板。
# 标【必填】的项必须由你填写，或设置同名环境变量；${XXX:} 表示默认留空。
# 密钥、证书、商户号只走环境变量，不要把真实值写进本文件提交到代码库。
# 未启用支付通道时，wechat / alipay 两组可以整组不填。

canteen:
  cart:
    # 单个购物车最多几种菜品
    max-item-types: 20
    # 同一菜品最多几份
    max-quantity-per-dish: 10
    # 购物车保留天数，0 表示长期保留；仅在使用 Redis 存储时生效
    ttl-days: 7
    # 加入购物车时是否检查菜品在售状态与库存
    check-stock: true
    # 结算时是否以数据库当前价格重算，防止菜品改价后按旧价结算
    reprice-on-checkout: true
    # 是否允许跨档口混装；false 时按档口拆成多笔订单（现有 dining_order 单档口结构）
    allow-multi-stall: false

  checkout:
    # 打包费，单位元，堂食场景填 0
    packing-fee: '0.00'
    # 配送费，单位元
    delivery-fee: '0.00'
    # 满多少元免配送费，0 表示不减免
    free-delivery-threshold: '0.00'
    # 起送金额，低于此金额不允许结算
    min-order-amount: '0.00'
    # 金额小数位
    scale: 2
    # 舍入模式：HALF_UP / DOWN
    rounding-mode: HALF_UP
    # 结算币种
    currency: CNY

  order:
    # 订单号前缀，与现有 OrderServiceImpl 的 CT 保持一致
    no-prefix: CT
    # 未支付订单自动关闭时间，单位分钟
    pay-timeout-minutes: 15
    # 同一购物车重复提交的幂等去重窗口，单位秒
    idempotent-window-seconds: 10
    # 支付成功是否扣减/占用库存
    deduct-stock-on-paid: true

  pay:
    # 【必填】支付通道：mock / wechat / alipay
    # 默认用 mock：内置模拟支付，不依赖外部网关，本地/答辩开箱即用、不会报「系统有点儿忙」。
    # 想接真实支付宝沙箱，把这里改成 alipay 并配好下面的密钥与 CANTEEN_PAY_NOTIFY_BASE_URL。
    channel: ${CANTEEN_PAY_CHANNEL:mock}
    # 是否使用沙箱环境
    sandbox: true
    # 【必填】支付平台异步回调可达的后端公网地址，本机联调填 http://127.0.0.1:8080；上线填域名或内网穿透地址
    notify-base-url: ${CANTEEN_PAY_NOTIFY_BASE_URL:}
    # 后端接收异步通知的路径，会自动拼上 context-path /api
    # 必须与 PayController 的 @PostMapping("/notify/alipay") 一致，否则回调 404
    notify-path: /pay/notify/alipay
    # 【必填】支付完成后前端跳回的页面地址
    return-url: ${CANTEEN_PAY_RETURN_URL:http://localhost:5173/my/orders}
    # 前端轮询支付结果的间隔秒数与最大次数
    query-interval-seconds: 2
    query-max-times: 30
    # 是否校验回调签名，接真实支付时必须为 true
    verify-signature: true
    # 回调来源 IP 白名单，逗号分隔，留空表示不限制
    notify-ip-whitelist: ''
    # 是否记录回调原始报文（含敏感字段，仅排障时开启）
    log-raw-notify: false

    mock:
      # 模拟支付是否自动成功；false 时由页面上手动确认支付
      auto-success: true
      # 模拟支付耗时，用于演示「支付处理中」状态
      delay-ms: 800

    wechat:
      # 【必填】公众号/小程序 AppID，微信支付商户平台获取
      app-id: ${CANTEEN_WECHAT_APP_ID:}
      # 【必填】商户号
      mch-id: ${CANTEEN_WECHAT_MCH_ID:}
      # 【必填】API v3 密钥
      api-v3-key: ${CANTEEN_WECHAT_API_V3_KEY:}
      # 【必填】商户证书序列号
      serial-no: ${CANTEEN_WECHAT_SERIAL_NO:}
      # 【必填】商户私钥文件路径，classpath: 或绝对路径
      private-key-path: ${CANTEEN_WECHAT_PRIVATE_KEY_PATH:}
      # 【必填】微信支付平台证书公钥路径，用于验签
      platform-cert-path: ${CANTEEN_WECHAT_PLATFORM_CERT_PATH:}
      # 交易类型：JSAPI / NATIVE / H5
      trade-type: NATIVE

    alipay:
      # 【必填】开放平台应用 AppID
      app-id: ${CANTEEN_ALIPAY_APP_ID:9021000171604126}
      # 【必填】应用私钥，PKCS8 格式
      private-key: ${CANTEEN_ALIPAY_PRIVATE_KEY:}
      # 【必填】支付宝公钥，用于验签
      alipay-public-key: ${CANTEEN_ALIPAY_PUBLIC_KEY:}
      # 【必填】网关地址：沙箱 https://openapi-sandbox.dl.alipaydev.com/gateway.do，生产 https://openapi.alipay.com/gateway.do
      gateway: ${CANTEEN_ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      # 签名算法
      sign-type: RSA2

  pay-job:
    # 扫描并关闭超时未支付订单的间隔，单位秒
    close-timeout-interval-seconds: 60
    # 对账任务执行时间，Cron 表达式，留空表示不启用
    reconcile-cron: ''
